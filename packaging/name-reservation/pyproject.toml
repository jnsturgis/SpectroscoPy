[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyspectroscopy"
# This is the only place the version is written. `pyspectroscopy/__init__.py`
# derives __version__ from installed metadata rather than repeating it -- 0.0.1
# shipped reporting itself as "0.0.0" because the two had been kept by hand and
# nothing compares them.
#
# 0.0.0 was deleted from PyPI (its sdist contained a credentials file) and a
# deleted PyPI version can never be re-uploaded, which is why the history here
# starts at 0.0.1. See the sdist whitelist at the bottom of this file.
version = "0.0.2"
description = "Name reservation for SpectroscoPy — a unified Python library for Raman, FTIR, UV-Vis and fluorescence spectra"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
authors = [{ name = "James N. Sturgis", email = "james.sturgis@univ-amu.fr" }]
keywords = ["spectroscopy", "raman", "ftir", "uv-vis", "fluorescence"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/jnsturgis/SpectroscoPy"
Issues = "https://github.com/jnsturgis/SpectroscoPy/issues"

[tool.hatch.build.targets.wheel]
packages = ["pyspectroscopy"]

# An explicit whitelist, not an exclude list. Hatchling's default is to put
# everything in this directory into the sdist, and that is how 0.0.0 shipped a
# credentials file that happened to be sitting here at build time. An exclude
# list only protects against the filenames somebody thought of in advance; a
# whitelist fails safe, because anything new is out unless it is named here.
[tool.hatch.build.targets.sdist]
only-include = [
    "pyspectroscopy",
    "README.md",
    "pyproject.toml",
]
# Hatchling always ships a .gitignore in the sdist; neither `exclude` nor
# `ignore-vcs` suppresses it. Without a local one it reaches up and ships the
# *repository's*, which leaks nothing secret but does publish that project's
# private housekeeping. The one-line .gitignore beside this file exists purely
# to be the one that ships. Note this file ships too -- keep incident detail
# in the repository, not in these comments.
