[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "spectroscopy"
description = "A common framework for handling and analysing spectra from different instruments"
readme = "README.md"
# Lowered from 3.12 once defect D6 was fixed: subtract_reference no longer uses
# f-strings that reuse the outer quote character (PEP 701, 3.12+).
requires-python = ">=3.10"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "James N. Sturgis" }]
keywords = ["spectroscopy", "FTIR", "ATR-FTIR", "UV-Vis", "Raman", "fluorescence", "JCAMP-DX"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.6",
]
dynamic = ["version"]

[project.optional-dependencies]
# PCA / NMF / ICA across a SpectrumCollection (Phase 4). An extra rather than a
# hard dependency: scikit-learn is a large download and someone doing FTIR
# baseline correction should not pay for it.
multivariate = [
    "scikit-learn>=1.3",
]
# pandas is deliberately NOT a dependency, hard or optional. See
# SpectroscoPy_Codebase_Review.md section 5.6: the core stays numpy-native and
# pandas is confined to explicit .to_dataframe() escape hatches that import it
# lazily, so it never becomes something a user has to have installed.
docs = [
    "sphinx>=7.0",
    "pydata-sphinx-theme>=0.15",
    "myst-nb>=1.0",
    "numpydoc>=1.6",
    "sphinx-copybutton>=0.5",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "pre-commit>=3.0",
]

[project.scripts]
spc-ftir-sidechains = "spectroscopy.cli.ftir_sidechains:main"

[project.urls]
Homepage = "https://github.com/jnsturgis/Spectroscopy1.0"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
# 'calc', 'formats' and 'tools_spc' are deprecated top-level shims kept so that
# existing notebooks keep importing. They are removed in 0.2 -- see
# SpectroscoPy_Codebase_Review.md Phase 0.
packages = ["spectroscopy", "formats", "tools_spc"]
# force-include, not include: 'packages' already fixes the source set, so a
# bare top-level module has to be added explicitly.
force-include = { "calc.py" = "calc.py" }
# spectroscopy/data/ is a ~100 kB curated subset of data/, shipped so that every
# example in the documentation runs for someone who has just pip-installed and
# has no data of their own. The full 5.6 MB collection stays in the repo only.
artifacts = ["spectroscopy/data/**"]
# spectroscopy/gui/splash.py is a 2024 scratch snippet, not a module: it has no
# __init__.py, references undefined names, and opens a Tk window at import.
# GUI work is late-phase by design (roadmap section 9), so it is not shipped.
exclude = ["spectroscopy/gui"]

[tool.hatch.build.targets.sdist]
exclude = ["/data", "/tools_stand_alone", "/toto", "/.github"]

# ---------------------------------------------------------------------------
# Linting
#
# The rule set is deliberately narrow to start with: it catches real errors
# (pyflakes F, pycodestyle E) without demanding a whole-codebase reformat that
# would bury the Phase 0.5 defect fixes in style churn. Tighten per module as
# each one is rewritten in Phase 1+.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
# Not part of the package: a GUI scratch snippet and the pre-Spectrum-class
# standalone tool, both superseded. Left in the tree, out of the build.
exclude = ["spectroscopy/gui", "tools_stand_alone"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # line length: legacy files, revisit per-module in Phase 1
    "E201", "E202", "E203", "E211",  # James' spacing style, e.g. f( x )
    "E226",  # missing whitespace around arithmetic operator
    "E741",  # ambiguous name 'l'/'I': present in the vendored JCAMP parser
]

[tool.ruff.lint.per-file-ignores]
# Shims deliberately re-export names they do not use.
"calc.py" = ["F401"]
"formats/__init__.py" = ["F401"]
"tools_spc/ftir_sidechains.py" = ["F401"]
"spectroscopy/__init__.py" = ["F401", "F403"]
# Vendored from github.com/nzhagen/jcamp; keep the diff to upstream small.
"spectroscopy/io/jcamp.py" = ["E", "F", "W", "I", "UP"]
# Contains a verbatim copy of the original notebook code, which is the thing
# being compared against -- tidying it would defeat the comparison.
"scripts/validate_ftir_sugars.py" = ["E", "F", "I"]
"scripts/validate_ck_nmf.py" = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:formats",
    "ignore::DeprecationWarning:calc",
]

[tool.coverage.run]
source = ["spectroscopy"]
